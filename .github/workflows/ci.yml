name: CI/CD

on:
  push:
    branches: [main, next, feat/*]
  pull_request:
    branches: [main, next]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main or next mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_and_test:
    name: build_and_test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changeset status compares against the base branch

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for a changeset
        if: github.event_name == 'pull_request' && matrix.node == '22'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint and format
        run: pnpm exec biome ci

      - name: Run tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - name: Check package exports
        if: matrix.node == '22'
        run: pnpm run lint:package

  # On main and next: opens or updates the changesets "Version Packages" PR while changesets are
  # pending. Once that PR is merged, stages the new version on npm (see scripts/release.sh).
  # Publishing stays in this workflow because the npm trusted publisher is bound to ci.yml.
  release:
    needs: build_and_test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stage publishing needs npm >= 11.15.0.
      - name: Update npm
        run: npm install -g npm@^11.15.0

      - name: Create or update the version PR
        id: changesets
        uses: changesets/action@v2
        with:
          pr-title: 'chore: release'
          commit-message: 'chore: release'

      - name: Stage the release on npm
        if: steps.changesets.outputs.has-changesets == 'false'
        run: scripts/release.sh
        env:
          GH_TOKEN: ${{ github.token }}
